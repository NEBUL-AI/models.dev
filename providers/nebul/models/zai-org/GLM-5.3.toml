# Served ID is zai-org/GLM-5.3 (Zhipu's Hugging Face org); canonical lab metadata lives at
# models/zhipuai/glm-5.3.toml. This file carries Nebul-specific overrides only.
# Efforts: reasoning_effort = low|high|max on POST /v1/chat/completions — the values
# the live catalog advertises in reasoning_efforts for this exact ID
# (https://api.inference.nebul.io/v1/model/info, re-verified 2026-09-23; sibling
# GLM-5.3-Flash advertises the same set) and the same set the lab
# (providers/zai) and OpenRouter entries use. An earlier revision of this file
# claimed the catalog advertised an empty list; that observation was stale.
# Traces arrive in reasoning_content: verified via a live probe of sibling
# GLM-5.3-Flash (POST /v1/chat/completions, 2026-09-23) — this exact ID is
# preview-gated and returns 404 without a preview-enabled key.
# https://docs.nebul.io/docs/inference-api/advanced-topics/reasoning
# limit.context = 1_048_576 is the live max_input_tokens for this exact ID
# (re-checked 2026-09-23); costs 1.47/4.62/0.35 are live catalog values, same date.
base_model = "zhipuai/glm-5.3"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 1.47
output = 4.62
cache_read = 0.35

[limit]
context = 1_048_576
