# Effort: reasoning_effort = none|low|medium|high|max; thinking is ON by default
# and none turns it off (all listed levels probe-verified 200 OK on 2026-09-23; set
# narrowed to the same-surface peer baseline — minimal/xhigh lacked distinct-effect
# evidence). The catalog's supports_reasoning = false for this ID is a false negative.
# Traces arrive in reasoning_content. Context/costs live-verified.
base_model = "nvidia/nemotron-3-super-120b-a12b"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "max"]

[cost]
input = 0.32
output = 0.69
cache_read = 0.08

[limit]
context = 1_000_000
