# Reasoning controls (live probes 2026-09-23, POST /v1/chat/completions):
# thinking is ON by default (reasoning_content traces); reasoning_effort
# turns it off with none and the backing engine accepts every graded level —
# minimal|low|medium|high|xhigh|max all return 200 with traces (some levels
# may be aliased by the engine; none reject). The catalog's
# supports_reasoning = false for this ID is a false negative (same pattern as
# gpt-oss-120b, which reasons despite the flag). NVIDIA's first-party NIM
# controls are NOT part of Nebul's surface here: a reasoning_budget field
# gets a 400 and a "/no_think" system instruction does not disable traces.
# Costs 1/3/0.5 are live values for this exact ID
# (https://api.nebul.com/v1/model/info, re-checked 2026-09-22).
base_model = "nvidia/nemotron-3-nano-30b-a3b"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[cost]
input = 1
output = 3
cache_read = 0.5
