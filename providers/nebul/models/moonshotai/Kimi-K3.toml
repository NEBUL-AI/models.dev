# Reasoning controls (live probes 2026-09-23, POST /v1/chat/completions):
# thinking is OFF by default; reasoning_effort = low|high|max turns it on
# (200 + traces) and none runs it off. medium|xhigh|minimal are rejected with
# "Kimi K3 supports thinking_effort values: low, high, max" — Nebul maps
# reasoning_effort onto the lab's thinking_effort parameter. Traces arrive in
# message.reasoning, so interleaved = true. The catalog's supports_reasoning =
# false for this ID is a false negative (same pattern as gpt-oss-120b, which
# reasons despite the flag).
# Costs 4.73/23.63/1.13 are live values for this exact ID
# (https://api.nebul.com/v1/model/info, re-checked 2026-09-22).
# An earlier revision of this file asserted reasoning = false on catalog
# evidence alone; probes supersede it.
base_model = "moonshotai/kimi-k3"

interleaved = true

[[reasoning_options]]
type = "effort"
values = ["none", "low", "high", "max"]

[cost]
input = 4.73
output = 23.63
cache_read = 1.13
