# Efforts: reasoning_effort = none|high (live probes 2026-09-23, POST
# /v1/chat/completions) — high returns 200 with traces, none runs off;
# low|medium|xhigh|max|minimal are rejected with
# "reasoning_effort=<value> is not supported by Mistral models". The catalog
# advertises reasoning_efforts = low|medium|high|max for this ID, which the
# served engine does not honor; probes and the lab/peers (none|high) win.
# Traces arrive in message.reasoning (probed 2026-09-23), so
# interleaved = true.
# https://api.inference.nebul.io/v1/model/info
# Costs 1.65/8.25 are the live catalog values for this exact ID
# (re-checked 2026-09-23).
base_model = "mistral/mistral-medium-2604"

interleaved = true

[[reasoning_options]]
type = "effort"
values = ["none", "high"]

[cost]
input = 1.65
output = 8.25
